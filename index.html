<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rashidson AI</title>

    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#151d33">
    <link rel="stylesheet" href="style.css?v=99">
     <style>
      /* FORCE SMALL LOGO - 38px */
      .logo{
        width:38px !important;
        height:38px !important;
        min-width:38px !important;
        min-height:38px !important;
        max-width:38px !important;
        max-height:38px !important;
        border-radius:10px !important;
        overflow:hidden !important;
      }
      .logo img{
        width:100% !important;
        height:100% !important;
        object-fit:contain !important;
      }
      .top-bar{
        height:60px !important;
        min-height:60px !important;
      }
    </style>
</head>

<body>

<div class="app">

    <header class="top-bar">

        <div class="brand">

            <div class="logo"style="width:38px;min-width:38px;">
                <img src="icon.png" alt="RSai"style="width:100%;height:100%;object-fit:contain;">
            </div>

            <div>
                <h1>Rashidson AI</h1>
                <p>Smart AI Assistant</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            Online
        </div>

    </header>


    <main id="chat" class="chat">

        <div class="welcome">

            <div class="welcome-logo">
                <img src="/icon.png" alt="RSai">
            </div>

            <h2>Welcome to Rashidson AI</h2>

            <p>
                Your intelligent AI assistant.
                Ask me anything and let's get started.
            </p>

        </div>


        <div class="message ai">

            <div class="avatar">
                <img src="/icon.png" alt="RSai">
            </div>

            <div class="message-content">

                <strong>Rashidson AI</strong>

                <p>
                    Hello! 👋 I'm Rashidson AI.
                    How can I help you today?
                </p>

            </div>

        </div>

    </main>
   <div class="input-area">

    <input
        id="messageInput"
        type="text"
        placeholder="Message Rashidson AI..."
        autocomplete="off"
    >

    <button id="micButton" type="button" title="Speak to Rashidson AI">
        🎤
    </button>

    <button id="sendButton" type="button">
        ➤
    </button>

</div>
 <div class="footer">
        Rashidson AI can make mistakes. Check important information.
    </div>

</div>


<script src="script.js"></script><script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(() => {
                console.log("Rashidson AI service worker registered");
            })
            .catch(error => {
                console.error("Service worker registration failed:", error);
            });
    });
}
</script>

</body>
</html>


</body>
</html>
